<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Оформление заявки | Конференции.РФ</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-light fw-bold" href="#">Конференции.РФ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="registration.html">Регистрация</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Авторизация</a></li>
                    <li class="nav-item"><a class="nav-link active" href="request.html">Оформление заявки</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h1 class="text-center text-dark mb-4">Оформление заявки</h1>

                        <form class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="place" class="form-label">Место</label>
                                <select class="form-select" id="place" required>
                                    <option value="" selected disabled>Укажите помещение для конференции</option>
                                    <option value="1">Зал А</option>
                                    <option value="2">Зал Б</option>
                                    <option value="3">Конференц-зал №1</option>
                                </select>
                                <div class="invalid-feedback">
                                    Выберите помещение для конференции.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Время и дата</label>
                                <div class="row g-2 align-items-center">
                                    <div class="col-auto">
                                        <label for="timeFrom" class="col-form-label">с</label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="text" class="form-control" id="timeFrom" placeholder="чч:мм" pattern="[0-9]{2}:[0-9]{2}" required>
                                        <div class="invalid-feedback">Формат: чч:мм.</div>
                                    </div>
                                    <div class="col-auto">
                                        <label for="timeTo" class="col-form-label">до</label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="text" class="form-control" id="timeTo" placeholder="чч:мм" pattern="[0-9]{2}:[0-9]{2}" required>
                                        <div class="invalid-feedback">Формат: чч:мм.</div>
                                    </div>
                                    <div class="col-auto">
                                        <input type="text" class="form-control" id="date" placeholder="дд.мм.гггг" pattern="[0-9]{2}\.[0-9]{2}\.[0-9]{4}" required>
                                        <div class="invalid-feedback">Формат: дд.мм.гггг.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fullname" class="form-label">ФИО</label>
                                <input type="text" class="form-control" id="fullname" value="Шингирей Екатерина Вадимовна" pattern="[А-Яа-яЁё ]+" required>
                                <div class="invalid-feedback">Введите ФИО кириллицей.</div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Телефон</label>
                                <input type="tel" class="form-control" id="phone" value="+7 (923) 123-45-67" pattern="\+7 \([0-9]{3}\) [0-9]{3}-[0-9]{2}-[0-9]{2}" required>
                                <div class="invalid-feedback">Формат: +7 (XXX) XXX-XX-XX.</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Адрес электронной почты</label>
                                <input type="email" class="form-control" id="email" value="ekaterina@ya.ru" required>
                                <div class="invalid-feedback">Введите корректный адрес электронной почты.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Способ оплаты</label>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" name="payment" id="paymentOnsite" value="onsite" required>
                                    <label class="form-check-label" for="paymentOnsite">При очном посещении</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" name="payment" id="paymentSbp" value="sbp" required>
                                    <label class="form-check-label" for="paymentSbp">СБП</label>
                                </div>
                                <div class="invalid-feedback d-block">
                                    Выберите способ оплаты.
                                </div>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary px-4">Отправить заявку</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
